<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sprout — 2.5D platformer prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
:root {
  --scene-mode: day;
  --sky-top: #6cc6ff;
  --sky-bottom: #dff5d2;
  --fog: #c9ead6;
  --panel: rgba(20, 38, 28, 0.66);
  --panel-solid: #17291f;
  --panel-border: rgba(255, 255, 255, 0.16);
  --scrim: rgba(6, 14, 10, 0.42);
  --text: #fff8ec;
  --text-dim: rgba(255, 248, 236, 0.72);
  --accent: #ffb547;
  --accent-ink: #2b1904;
  --heart: #ff5a6e;
  --heart-empty: rgba(255, 255, 255, 0.22);
  --fruit: #ff4f9a;
  --power: #ffd84a;
  --track: rgba(255, 255, 255, 0.18);
  --tile: rgba(255, 255, 255, 0.07);
  --kbd-bg: rgba(255, 255, 255, 0.13);
  --kbd-shadow: rgba(0, 0, 0, 0.35);
  --touch-bg: rgba(20, 38, 28, 0.36);
  --touch-bg-down: rgba(255, 181, 71, 0.5);
  --touch-border: rgba(255, 255, 255, 0.38);
  --touch-knob: rgba(255, 248, 236, 0.78);
  --fade: #05080a;
  --vignette: rgba(4, 12, 6, 0.42);
  --focus: #fff1c9;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --scene-mode: night;
    --sky-top: #070d22;
    --sky-bottom: #1d3550;
    --fog: #1b3247;
    --panel: rgba(8, 12, 22, 0.72);
    --panel-solid: #0e1424;
    --scrim: rgba(2, 4, 10, 0.55);
    --touch-bg: rgba(8, 12, 22, 0.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --scene-mode: night;
  --sky-top: #070d22;
  --sky-bottom: #1d3550;
  --fog: #1b3247;
  --panel: rgba(8, 12, 22, 0.72);
  --panel-solid: #0e1424;
  --scrim: rgba(2, 4, 10, 0.55);
  --touch-bg: rgba(8, 12, 22, 0.45);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; height: 100%; overflow: hidden;
  background: linear-gradient(180deg, var(--sky-top), var(--sky-bottom));
  color: var(--text);
  font-family: "Fredoka", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  touch-action: none; -webkit-tap-highlight-color: transparent;
}
#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.vignette { position: fixed; inset: 0; z-index: 1; pointer-events: none; background: radial-gradient(ellipse 85% 80% at 50% 46%, transparent 58%, var(--vignette) 100%); }

/* HUD */
.hud {
  position: fixed; top: 0; left: 0; right: 0; z-index: 5;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) calc(env(safe-area-inset-right, 0px) + 14px) 0 calc(env(safe-area-inset-left, 0px) + 14px);
  pointer-events: none;
}
.hud-left { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.hud-right { display: flex; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 14px;
  border-radius: 999px; background: var(--panel); border: 1px solid var(--panel-border);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  font-weight: 600; font-size: 17px; font-variant-numeric: tabular-nums;
}
.heart { width: 20px; height: 20px; fill: currentColor; transition: transform .2s, color .2s; }
.heart.on { color: var(--heart); }
.heart.off { color: var(--heart-empty); transform: scale(.82); }
.fruit-dot { width: 14px; height: 14px; border-radius: 50%; background: var(--fruit); box-shadow: inset -3px -3px 0 rgba(0,0,0,.22), inset 3px 3px 0 rgba(255,255,255,.35); }
.power { display: none; }
.power.show { display: inline-flex; }
.power .label { color: var(--power); font-size: 15px; }
.power .bar { width: 72px; height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; }
.power .bar i { display: block; height: 100%; width: 100%; background: var(--power); transform-origin: left center; }
.icon-btn {
  pointer-events: auto; width: 40px; height: 40px; padding: 0; border-radius: 50%;
  border: 1px solid var(--panel-border); background: var(--panel); color: var(--text);
  display: grid; place-items: center; cursor: pointer;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn .off-icon { display: none; }
.icon-btn.muted .on-icon { display: none; }
.icon-btn.muted .off-icon { display: block; }
.icon-btn:focus-visible, .btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

/* Contextual hint */
.hint {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); z-index: 5;
  transform: translate(-50%, 12px); width: max-content; max-width: min(92vw, 560px);
  padding: 10px 18px; border-radius: 16px; background: var(--panel); border: 1px solid var(--panel-border);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  font-size: 17px; line-height: 1.45; text-align: center;
  opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none;
}
.hint.show { opacity: 1; transform: translate(-50%, 0); }
body.touch .hint { bottom: auto; top: calc(env(safe-area-inset-top, 0px) + 60px); transform: translate(-50%, -12px); font-size: 15px; }
body.touch .hint.show { transform: translate(-50%, 0); }
@media (orientation: landscape) { body.touch .hint { top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); max-width: min(50vw, 430px); font-size: 14px; padding: 8px 14px; transform: translate(-50%, 12px); } }
kbd {
  display: inline-block; font: 600 .86em/1 "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  padding: 4px 7px 3px; margin: 0 1px; border-radius: 6px; background: var(--kbd-bg);
  border: 1px solid var(--panel-border); box-shadow: 0 2px 0 var(--kbd-shadow); color: var(--text);
}

/* Toast & fade */
.toast {
  position: fixed; left: 50%; top: 24%; z-index: 5; transform: translate(-50%, 0);
  font-weight: 700; font-size: clamp(26px, 4.5vw, 42px); color: var(--accent); white-space: nowrap;
  text-shadow: 0 3px 0 rgba(0,0,0,.35), 0 0 20px rgba(0,0,0,.25);
  opacity: 0; pointer-events: none;
}
.toast.pop { animation: toast 1.5s ease-out forwards; }
@keyframes toast {
  0% { opacity: 0; transform: translate(-50%, 10px) scale(.8); }
  12% { opacity: 1; transform: translate(-50%, 0) scale(1.08); }
  22% { transform: translate(-50%, 0) scale(1); }
  75% { opacity: 1; }
  100% { opacity: 0; transform: translate(-50%, -14px); }
}
.fade { position: fixed; inset: 0; z-index: 7; background: var(--fade); opacity: 0; pointer-events: none; transition: opacity .35s; }
.fade.on { opacity: .72; }

/* Overlays */
.overlay {
  position: fixed; inset: 0; z-index: 10; display: none; place-items: center;
  padding: calc(env(safe-area-inset-top, 0px) + 16px) calc(env(safe-area-inset-right, 0px) + 16px) calc(env(safe-area-inset-bottom, 0px) + 16px) calc(env(safe-area-inset-left, 0px) + 16px);
  background: var(--scrim); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
}
.overlay.show { display: grid; }
.card {
  width: min(100%, 440px); max-height: 100%; overflow: auto;
  background: var(--panel-solid); border: 1px solid var(--panel-border); border-radius: 22px;
  padding: 24px 26px 22px; text-align: center; box-shadow: 0 22px 60px rgba(0,0,0,.35);
}
.card h1 { margin: 0 0 4px; font-size: clamp(46px, 10vw, 68px); line-height: 1; color: var(--accent); text-shadow: 0 5px 0 rgba(0,0,0,.3); }
.card h2 { margin: 0 0 12px; font-size: 32px; line-height: 1.1; color: var(--accent); }
.sub { margin: 6px 0 16px; color: var(--text-dim); font-size: 16px; line-height: 1.4; }
.controls { display: grid; grid-template-columns: auto auto; gap: 7px 16px; text-align: left; margin: 0 auto 18px; width: fit-content; font-size: 15px; align-items: center; }
.controls dt { color: var(--text-dim); }
.controls dd { margin: 0; }
.portrait-note { display: none; margin: -6px 0 14px; color: var(--accent); font-size: 14px; }
@media (orientation: portrait) { body.touch .portrait-note { display: block; } }
.btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.btn {
  font: 700 18px/1 "Fredoka", "Trebuchet MS", system-ui, sans-serif; padding: 13px 26px; border-radius: 999px;
  border: 1px solid var(--panel-border); background: transparent; color: var(--text); cursor: pointer;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; box-shadow: 0 4px 0 rgba(0,0,0,.3); }
.btn:active { transform: translateY(2px); }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 4px 0 18px; }
.stat { background: var(--tile); border-radius: 14px; padding: 10px 8px; }
.stat b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--text-dim); }

/* Touch controls */
#touch { position: fixed; inset: 0; z-index: 6; pointer-events: none; display: none; }
body.touch #touch { display: block; }
#stickZone { position: absolute; left: 0; bottom: 0; width: 50%; height: 72%; pointer-events: auto; touch-action: none; }
#stickGhost {
  position: absolute; left: calc(env(safe-area-inset-left, 0px) + 34px); bottom: calc(env(safe-area-inset-bottom, 0px) + 30px);
  width: 104px; height: 104px; border-radius: 50%; border: 2px dashed var(--touch-border); background: var(--touch-bg);
  opacity: .75; transition: opacity .2s;
}
#stickGhost.hide { opacity: 0; }
#stickBase {
  position: fixed; left: 0; top: 0; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%;
  background: var(--touch-bg); border: 2px solid var(--touch-border); opacity: 0; pointer-events: none;
}
#stickBase.on { opacity: 1; }
#stickKnob { position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; margin: -25px 0 0 -25px; border-radius: 50%; background: var(--touch-knob); }
.tbtn {
  position: absolute; display: grid; place-items: center; padding: 0; border-radius: 50%;
  pointer-events: auto; touch-action: none; font: 700 15px/1 "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  color: var(--text); background: var(--touch-bg); border: 2px solid var(--touch-border);
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
}
.tbtn.down { background: var(--touch-bg-down); transform: scale(.93); }
#btnJump { width: 92px; height: 92px; right: calc(env(safe-area-inset-right, 0px) + 22px); bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); }
#btnSpit { width: 74px; height: 74px; right: calc(env(safe-area-inset-right, 0px) + 128px); bottom: calc(env(safe-area-inset-bottom, 0px) + 46px); }

@media (prefers-reduced-motion: reduce) {
  .toast.pop { animation: toast-still 1.5s linear forwards; }
  @keyframes toast-still { 0%, 80% { opacity: 1; } 100% { opacity: 0; } }
  .hint, .fade { transition: none; }
}
</style>
</head>
<body>
<canvas id="game" aria-label="Game view"></canvas>
<div class="vignette"></div>

<div class="hud">
  <div class="hud-left">
    <div class="chip" id="hearts" aria-label="Health"></div>
    <div class="chip" aria-label="Fruit collected"><span class="fruit-dot"></span><span id="fruitCount">0/0</span></div>
    <div class="chip power" id="power"><span class="label">Triple seed</span><span class="bar"><i id="powerBar"></i></span></div>
  </div>
  <div class="hud-right">
    <button class="icon-btn" id="muteBtn" aria-label="Toggle sound">
      <svg class="on-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
      <svg class="off-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 5 6"/><path d="m21 9-5 6"/></svg>
    </button>
    <button class="icon-btn" id="pauseBtn" aria-label="Pause">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
    </button>
  </div>
</div>
<div class="hint" id="hint" role="status" aria-live="polite"></div>
<div class="toast" id="toast"></div>
<div class="fade" id="fade"></div>
<div id="touch">
  <div id="stickZone"><div id="stickGhost"></div></div>
  <div id="stickBase"><div id="stickKnob"></div></div>
  <button class="tbtn" id="btnSpit" aria-label="Spit">SPIT</button>
  <button class="tbtn" id="btnJump" aria-label="Jump">JUMP</button>
</div>
<div class="overlay show" id="overlay"><div class="card"><p class="sub" style="margin:0">Growing the jungle…</p></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';

/* ───────────────────────── Config ───────────────────────── */
const bootT0 = performance.now(); let bootMs = 0;
const STEP = 1 / 60;                 // fixed simulation step
const PHYS = {
  gravity: 40, fallMul: 1.35, apexMul: 0.55, apexBand: 2.2, maxFall: 18,
  runSpeed: 7, groundAccel: 70, groundDecel: 60, turnBoost: 1.7, airAccel: 40, airDecel: 16,
  jumpVel: 16.5, jumpCut: 0.45, coyote: 0.1, jumpBuffer: 0.12,
  stompBounce: 11, stompBounceHeld: 15.5,
};
const PLAYER_W = 0.72, PLAYER_H = 0.92, MAX_HP = 3;
const SEED_SPEED = 15, SEED_LIFE = 0.55, SPIT_CD = 0.2, POWER_TIME = 20;
const EPS = 1e-4;
const COLORS = {
  seed: 0xd8ff5a, fruit: 0xff6fb0, dust: 0xe9dcbc, walker: 0xa78bfa, flyer: 0xff6b6b,
  power: 0xffd84a, glow: 0xffb547, player: 0xff8a3d, portal: 0x9ff7ff,
};
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ───────────────────────── Utils ───────────────────────── */
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
const approach = (v, target, d) => (v < target ? Math.min(v + d, target) : Math.max(v - d, target));
const damp = (a, b, lambda, dt) => lerp(a, b, 1 - Math.exp(-lambda * dt));
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const R = mulberry32(1111);
const hash2 = (x, y) => { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); };
const tmpColor = new THREE.Color(), tmpColor2 = new THREE.Color();
const mixHex = (a, b, t) => tmpColor.setHex(a).lerp(tmpColor2.setHex(b), t).getHex();
const $ = sel => document.querySelector(sel);

/* ───────────────────────── Tile map ─────────────────────────
   Level authoring is a tiny script of helpers so it maps 1:1 to
   what an LDtk/Tiled JSON import would produce later.            */
const LW = 146, LH = 18;
const T = { EMPTY: 0, DIRT: 1, STONE: 2, LEDGE: 3, SPIKE: 4 };
const tiles = new Uint8Array(LW * LH);
function tileAt(x, y) {
  if (x < 0 || x >= LW) return T.STONE;       // hard level bounds
  if (y < 0 || y >= LH) return T.EMPTY;
  return tiles[y * LW + x];
}
function setTile(x, y, t) { if (x >= 0 && x < LW && y >= 0 && y < LH) tiles[y * LW + x] = t; }
const isSolid = t => t === T.DIRT || t === T.STONE;
const L = {
  ground(x0, x1, top, t = T.DIRT) { for (let x = x0; x <= x1; x++) for (let y = 0; y < top; y++) setTile(x, y, t); },
  rect(x0, x1, y0, y1, t = T.STONE) { for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) setTile(x, y, t); },
  ledge(x0, x1, y) { for (let x = x0; x <= x1; x++) setTile(x, y, T.LEDGE); },
  spikes(x0, x1, y) { for (let x = x0; x <= x1; x++) setTile(x, y, T.SPIKE); },
};

/* ───────────────────────── Physics ─────────────────────────
   Bodies: x = center, y = feet. Axis-separated AABB vs tile grid. */
function makeBody(x, y, w, h) { return { x, y, px: x, py: y, w, h, vx: 0, vy: 0, grounded: false, hitWall: false, ride: null }; }

function moveX(b, dx) {
  b.hitWall = false;
  if (dx === 0) return;
  b.x += dx;
  const y0 = Math.floor(b.y + EPS), y1 = Math.floor(b.y + b.h - EPS);
  const x0 = Math.floor(b.x - b.w / 2 + EPS), x1 = Math.floor(b.x + b.w / 2 - EPS);
  for (let ty = y0; ty <= y1; ty++) {
    for (let tx = x0; tx <= x1; tx++) {
      if (!isSolid(tileAt(tx, ty))) continue;
      if (dx > 0) b.x = Math.min(b.x, tx - b.w / 2);
      else b.x = Math.max(b.x, tx + 1 + b.w / 2);
      b.hitWall = true;
    }
  }
}

function moveY(b, dy, ignoreLedges) {
  const prevBottom = b.y;
  b.y += dy;
  b.grounded = false;
  let bonk = false;
  const x0 = Math.floor(b.x - b.w / 2 + EPS), x1 = Math.floor(b.x + b.w / 2 - EPS);
  const y0 = Math.floor(b.y + EPS), y1 = Math.floor(b.y + b.h - EPS);
  for (let ty = y0; ty <= y1; ty++) {
    for (let tx = x0; tx <= x1; tx++) {
      const t = tileAt(tx, ty);
      if (isSolid(t)) {
        if (dy > 0) { b.y = Math.min(b.y, ty - b.h); bonk = true; }
        else if (dy < 0) { b.y = Math.max(b.y, ty + 1); b.grounded = true; }
      } else if (t === T.LEDGE && dy < 0 && !ignoreLedges && prevBottom >= ty + 1 - 0.02) {
        b.y = Math.max(b.y, ty + 1); b.grounded = true;   // one-way: only from above
      }
    }
  }
  return bonk;
}

function landOnPlatforms(b, prevBottom, ignore) {
  if (ignore || b.vy > 0) return;
  for (const p of world.platforms) {
    const top = p.y + p.h;
    if (b.x + b.w / 2 > p.x + 0.02 && b.x - b.w / 2 < p.x + p.w - 0.02 && prevBottom >= top - 0.05 && b.y <= top) {
      b.y = top; b.grounded = true; b.ride = p;
    }
  }
}

function standingOnLedge(b) {
  const ty = Math.floor(b.y - 0.05);
  const x0 = Math.floor(b.x - b.w / 2 + EPS), x1 = Math.floor(b.x + b.w / 2 - EPS);
  let ledge = false;
  for (let tx = x0; tx <= x1; tx++) {
    const t = tileAt(tx, ty);
    if (isSolid(t)) return false;
    if (t === T.LEDGE) ledge = true;
  }
  return ledge;
}

function touchingSpikes(b) {
  const x0 = Math.floor(b.x - b.w / 2 + 0.12), x1 = Math.floor(b.x + b.w / 2 - 0.12);
  const ty = Math.floor(b.y + EPS);
  for (let tx = x0; tx <= x1; tx++) if (tileAt(tx, ty) === T.SPIKE && b.y < ty + 0.45) return true;
  return false;
}

function groundBelow(x, y) {
  const tx = Math.floor(x);
  let best = null;
  for (let ty = Math.min(Math.floor(y), LH - 1); ty >= 0; ty--) {
    const t = tileAt(tx, ty);
    if ((isSolid(t) || t === T.LEDGE) && ty + 1 <= y + 0.001) { best = ty + 1; break; }
  }
  for (const p of world.platforms) {
    const top = p.y + p.h;
    if (x >= p.x && x <= p.x + p.w && top <= y + 0.001 && (best === null || top > best)) best = top;
  }
  return best;
}

const aabb = (a, b, s = 0) =>
  a.x - a.w / 2 + s < b.x + b.w / 2 - s && a.x + a.w / 2 - s > b.x - b.w / 2 + s &&
  a.y + s < b.y + b.h - s && a.y + a.h - s > b.y + s;

/* ───────────────────────── Renderer, scene, lights ───────────────────────── */
const canvas = $('#game');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const MAX_ANISO = Math.min(8, renderer.capabilities.getMaxAnisotropy());
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xa9c9b8, 0.0125);
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 700);
const UP = new THREE.Vector3(0, 1, 0);
const WHITE = [1, 1, 1];
const lin = hex => new THREE.Color(hex).convertSRGBToLinear();
const smoothstep = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };

function drawSign(s) {

  for (let i = 0; i < 3; i++) {

    g.strokeStyle = 'rgba(30,16,6,0.28)'; g.lineWidth = 1.5;
    for (let k = 0; k < 7; k++) { const yy = y0 + 4 + rnd() * 35; g.beginPath(); g.moveTo(0, yy); g.bezierCurveTo(70, yy + rnd() * 6 - 3, 180, yy + rnd() * 6 - 3, 256, yy + rnd() * 4 - 2); g.stroke(); }
    g.fillStyle = 'rgba(20,10,4,0.6)'; g.fillRect(0, y0 + 41, 256, 2.5);
  }
  for (const nx of [14, 242]) for (const ny of [22, 64, 106]) { g.fillStyle = 'rgba(25,20,18,0.85)'; g.beginPath(); g.arc(nx, ny, 3.2, 0, Math.PI * 2); g.fill(); }
  let size = 60;

  g.fillStyle = 'rgba(20,10,4,0.55)'; g.fillText(s.label, 130, 70);
  g.fillStyle = '#fff6df'; g.fillText(s.label, 128, 67);

  g.globalCompositeOperation = 'destination-over';
  g.fillStyle = '#5a3d25'; g.fillRect(0, 0, 256, 128);

}

/* ───────────────────────── Terrain mesh ─────────────────────────
   Collision stays on the tile grid; the visible surface is a merged mesh with a
   noise-displaced front face, world-space UVs and depth-darkened vertex colours. */
const frontDisp = (x, y) => (fbm(x * 0.5 + 11.3, y * 0.5 + 44.7, NP, NP, 3) - 0.5) * 0.55 + (n2(x * 2.3 + 1.7, y * 2.3 + 60) - 0.5) * 0.09;
const frontZ = (x, y) => 1.5 + frontDisp(x, y);
function frontNormal(x, y) {
  const e = 0.12, dx = (frontDisp(x + e, y) - frontDisp(x - e, y)) / (2 * e), dy = (frontDisp(x, y + e) - frontDisp(x, y - e)) / (2 * e), l = Math.hypot(dx, dy, 1);
  return [-dx / l, -dy / l, 1 / l];
}
const BEDROCK = 6;                                            // rows drawn below the map so the cliff face runs off-screen
const solidVis = (x, y) => isSolid(tileAt(x, Math.max(y, 0)));
const pitColumn = x => x >= 0 && x < LW && !isSolid(tileAt(x, 0));
const pitDark = y => clamp((y + 0.2) / 3, 0.04, 1);          // walls fade to black below the walking line

function buildTerrain() {
  const face = { dirt: new Batch(), rock: new Batch() }, top = new Batch(), fringe = new Batch(), planks = new Batch(), roots = new Batch();
  const depth = new Uint8Array(LW * LH);
  for (let x = 0; x < LW; x++) { let d = 0; for (let y = LH - 1; y >= 0; y--) { if (isSolid(tileAt(x, y))) { depth[y * LW + x] = d; d++; } else d = 0; } }
  const depthAt = (x, y) => (y >= 0 ? depth[y * LW + x] : depth[x] - y);
  const shade = (X, Y, x, y) => { const s = 0.46 + 0.54 * Math.exp(-(depthAt(x, y) + (y + 1 - Y)) * 0.3) + (hash2(X * 3.1, Y * 2.7) - 0.5) * 0.06; return [s, s, s * 0.98]; };
  const stakes = [];

  for (let y = -BEDROCK; y < LH; y++) for (let x = 0; x < LW; x++) {
    const t = tileAt(x, y);
    if (y >= 0 && t === T.LEDGE) {
      const uo = hash2(x, y) * 3, drop = hash2(y, x) * 0.012;
      planks.box(x + 0.5, y + 0.9 - drop, 0, 0.97, 0.2, 2.3, [0.95, 0.9 + hash2(x, 7) * 0.1, 0.85], 0.35, uo, hash2(x, 3));
      if (tileAt(x - 1, y) !== T.LEDGE || tileAt(x + 1, y) !== T.LEDGE || x % 3 === 0) planks.box(x + 0.5, y + 0.72, 0.05, 0.17, 0.17, 2.6, [0.6, 0.55, 0.5], 0.35, uo + 1.3, 0.2);
      continue;
    }
    if (y >= 0 && t === T.SPIKE) {
      for (const ox of [0.2, 0.5, 0.8]) for (const oz of [-0.75, 0, 0.75]) {
        const h = 0.5 + R() * 0.2;
        stakes.push({ x: x + ox + (R() - 0.5) * 0.08, y: y + h / 2 - 0.02, z: oz + (R() - 0.5) * 0.3, h, rx: (R() - 0.5) * 0.3, rz: (R() - 0.5) * 0.3 });
      }
      continue;
    }

const Input = {

  codes: new Set(),
  touch: { left: false, right: false, up: false, down: false, jump: false, spit: false },
  pad: { left: false, right: false, up: false, down: false, jump: false, spit: false, a: false, start: false, aPressed: false, startPressed: false },
  latchJump: false, latchSpit: false, prevJump: false, prevSpit: false, padOK: true,

addEventListener('keydown', e => {

    if (e.code === 'Enter' || e.code === 'Space') { e.preventDefault(); primaryAction(); return; }
    if ((e.code === 'Escape' || e.code === 'KeyP') && state.overlay === 'pause') { e.preventDefault(); resume(); return; }
  }

  const l2 = Math.hypot(dx, dy), c = l2 > 46 ? 46 / l2 : 1;

  stickKnob.style.transform = `translate(${dx * c}px, ${dy * c}px)`;

/* ───────────────────────── Game state ───────────────────────── */
const state = { mode: 'title', overlay: null, hitstop: 0, time: 0, hint: null };
const stats = { fruits: 0, kills: 0, deaths: 0 };
const cam = { x: 0, y: 3, ty: 3, look: 1.2, shake: 0, dist: 15, halfW: 9, halfH: 5 };

function shake(a) { if (!reducedMotion) cam.shake = Math.max(cam.shake, a); }

function onJump() { const v = player.vis; v.sq = 1.28; v.sqVel = 0; emit(player.body.x, player.body.y + 0.05, 5, COLORS.dust, { speed: 2, up: 0.6, life: 0.3, size: 0.7, grav: 4 }); sfx('jump'); }

function updatePlayer(dt) {
  const p = player, b = p.body, inp = Input.state;
  if (p.dead) {
    p.deadTimer -= dt;
    if (p.deadTimer < 0.45) fadeEl.classList.add('on');
    if (p.deadTimer <= 0) respawnPlayer();

  }

  p.knock = Math.max(0, p.knock - dt);
  p.spitCd -= dt;
  p.dropTimer = Math.max(0, p.dropTimer - dt);
  if (p.power > 0) p.power = Math.max(0, p.power - dt);
  p.coyote = wasGrounded ? PHYS.coyote : Math.max(0, p.coyote - dt);
  p.buffer = inp.jumpPressed ? PHYS.jumpBuffer : Math.max(0, p.buffer - dt);

  if (b.ride && wasGrounded) { moveX(b, b.ride.dx); b.y += b.ride.dy; }

  // Horizontal
  const dir = p.knock > 0 ? 0 : (inp.right ? 1 : 0) - (inp.left ? 1 : 0);
  if (dir) p.facing = dir;
  if (p.knock <= 0) {
    let accel = wasGrounded ? (dir ? PHYS.groundAccel : PHYS.groundDecel) : (dir ? PHYS.airAccel : PHYS.airDecel);

  } else if (p.buffer > 0 && p.coyote > 0) {
    if (b.ride) b.vx += b.ride.dx / dt;          // keep platform momentum
    b.vy = PHYS.jumpVel; p.buffer = 0; p.coyote = 0; p.jumping = true;
    b.grounded = false; b.ride = null;

  emit(b.x, b.y + 0.5, 10, 0xffffff, { speed: 4, up: 2, life: 0.35, size: 0.8 });
  if (p.hp <= 0) { die(); return; }
  sfx('hurt');
  p.invuln = 1.3; p.knock = 0.28; p.jumping = false;
  b.vx = (b.x < fromX ? -1 : 1) * 6; b.vy = bounce; b.grounded = false; b.ride = null;
  p.vis.sq = 1.25;

  p.dead = true; p.deadTimer = 0.85; p.hp = 0; stats.deaths++;

  b.vx = b.vy = 0; b.ride = null; b.grounded = true;

function updateEnemies(dt) {
  const p = player, pb = p.body, inp = Input.state;
  for (const e of world.enemies) {
    if (!e.alive) { if (e.deathT > 0) e.deathT = Math.max(0, e.deathT - dt); continue; }
    const b = e.body;
    if (e.type === 'walker') {
      b.vx = e.dir * 1.6;
      b.vy = Math.max(b.vy - PHYS.gravity * dt, -PHYS.maxFall);
      moveX(b, b.vx * dt);
      if (b.hitWall) e.dir *= -1;
      moveY(b, b.vy * dt, false);
      if (b.grounded) {
        b.vy = 0;
        const t = tileAt(Math.floor(b.x + e.dir * (b.w / 2 + 0.06)), Math.floor(b.y - 0.1));
        if (!isSolid(t) && t !== T.LEDGE) e.dir *= -1;      // turn at ledges

      if (b.y < -5) { e.alive = false; continue; }
    } else {
      e.t += dt;
      b.x = e.ax + Math.sin(e.t * 0.9) * e.range;
      b.y = e.ay + Math.sin(e.t * 2.3) * 0.22;
      e.dir = Math.cos(e.t * 0.9) >= 0 ? 1 : -1;
    }
    if (p.dead || state.mode !== 'play' || !aabb(pb, b, 0.08)) continue;
    if (e.stompable && pb.vy < 0 && pb.py >= b.y + b.h - 0.35) {

  emit(e.body.x, e.body.y + 0.1, 6, COLORS.dust, { speed: 3, up: 0.5, life: 0.4, size: 0.8 });
  sfx('stomp'); shake(0.2); state.hitstop = 0.05;
}
function damageEnemy(e) {

  if (e.hp > 0) return;
  e.alive = false; e.deathT = 0; stats.kills++;
  emit(e.body.x, e.body.y + e.body.h / 2, 16, e.type === 'walker' ? COLORS.walker : COLORS.flyer, { speed: 5, up: 1.5, life: 0.55 });
  sfx('pop'); shake(0.12);

function updateSeeds(dt) {
  for (const s of seeds) {
    if (!s.active) continue;
    s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
    if (s.life <= 0 || isSolid(tileAt(Math.floor(s.x), Math.floor(s.y)))) {
      s.active = false;
      emit(s.x, s.y, 3, COLORS.seed, { speed: 1.5, up: 0.3, life: 0.25, size: 0.6, grav: 0 });
      continue;
    }
    for (const e of world.enemies) {
      if (!e.alive) continue;
      const b = e.body;
      if (s.x > b.x - b.w / 2 - 0.12 && s.x < b.x + b.w / 2 + 0.12 && s.y > b.y - 0.12 && s.y < b.y + b.h + 0.12) {
        s.active = false; damageEnemy(e); break;
      }
    }
    if (s.active && (++s.trail & 1)) emit(s.x, s.y, 1, COLORS.seed, { speed: 0.2, up: 0, life: 0.18, size: 0.5, grav: 0, spreadZ: 0 });
  }
}

function interactions() {
  const p = player, b = p.body;
  if (p.dead) return;
  const cx = b.x, cy = b.y + b.h / 2;
  for (const f of world.fruits) {
    if (f.taken || Math.abs(f.x - cx) > 0.6 || Math.abs(f.y - cy) > 0.7) continue;
    f.taken = true; f.mesh.visible = false; stats.fruits++;
    emit(f.x, f.y, 10, COLORS.fruit, { speed: 3, up: 1.5, life: 0.45, size: 0.8, grav: 6 });
    sfx('fruit'); updateHUD();
  }
  for (const u of world.powerups) {
    if (u.taken || Math.abs(u.x - cx) > 0.7 || Math.abs(u.y - cy) > 0.8) continue;
    u.taken = true; u.mesh.visible = false; p.power = POWER_TIME;
    emit(u.x, u.y, 20, COLORS.power, { speed: 4, up: 2, life: 0.6 });
    sfx('power'); toast('Triple seed!');
  }
  for (const c of world.checkpoints) {
    if (c.active || Math.abs(c.x - b.x) > 0.9 || b.y < c.y - 0.5 || b.y > c.y + 3) continue;
    setCheckpointActive(c, true); world.respawn = { x: c.x, y: c.y };
    emit(c.x, c.y + 1.95, 18, COLORS.glow, { speed: 3, up: 2, life: 0.7, z: -0.6 });
    sfx('checkpoint'); toast('Checkpoint');
  }
  const gl = world.goal;
  if (gl && state.mode === 'play' && Math.abs(b.x - gl.x) < 0.8 && b.y >= gl.y - 0.5 && b.y < gl.y + 3.2) win();

  let near = null, best = 2.8;
  for (const s of world.signs) {
    const d = Math.abs(s.x - b.x);
    if (d < best && Math.abs(s.y - b.y) < 2.6) { best = d; near = s; }
  }
  setHint(near ? near.hint : null);
}

function win() {
  state.mode = 'won';
  setHint(null); sfx('win');
  const gl = world.goal;
  for (const c of [COLORS.portal, COLORS.glow, COLORS.fruit, COLORS.seed]) emit(gl.x, gl.y + 1.6, 14, c, { speed: 6, up: 3, life: 1.0, size: 1.1, grav: 6 });
  setTimeout(() => { if (state.mode === 'won') showOverlay('win'); }, 1000);
}

function snapshot() {
  const b = player.body; b.px = b.x; b.py = b.y;
  for (const e of world.enemies) { e.body.px = e.body.x; e.body.py = e.body.y; }
  for (const p of world.platforms) { p.px = p.x; p.py = p.y; }
  for (const s of seeds) { s.px = s.x; s.py = s.y; }
}

function step(dt) {
  if (state.hitstop > 0) { state.hitstop -= dt; return; }
  Input.sample();
  if (state.mode === 'won') Input.neutral();
  if (state.mode === 'play') state.time += dt;
  updatePlatforms(dt);
  updatePlayer(dt);
  updateEnemies(dt);
  updateSeeds(dt);
  interactions();
}

function resetLevel() {
  for (const e of world.enemies) resetEnemy(e);
  for (const f of world.fruits) { f.taken = false; f.mesh.visible = true; }
  for (const c of world.checkpoints) setCheckpointActive(c, false);
  for (const p of world.platforms) { p.t = 0; p.x = p.px = p.ax; p.y = p.py = p.ay; p.dx = p.dy = 0; }
  for (const s of seeds) s.active = false;
  world.respawn = { ...world.spawn };
  stats.fruits = stats.kills = stats.deaths = 0;
  state.time = 0; state.hitstop = 0;
  player.facing = 1;
  respawnPlayer();
  player.invuln = 0;
  setHint(null);
}

}

function animatePlayer(dt, x, y) {

    d.position.set(gx + Math.cos(ang) * p.facing * dist, gy + Math.sin(ang) * dist, 0.2);

}

function animateEnemy(e, dt, alpha) {
  const b = e.body, m = e.mesh, u = m.userData;

    e.shadow.visible = false;
    return;

let clock = 0;
function render(dt, alpha) {

  animatePlayer(dt, px, py);
  for (const e of world.enemies) animateEnemy(e, dt, alpha);
  for (const pl of world.platforms) pl.mesh.position.set(lerp(pl.px, pl.x, alpha) + pl.w / 2, lerp(pl.py, pl.y, alpha), 0);
  for (const s of seeds) { s.mesh.visible = s.active; if (s.active) s.mesh.position.set(lerp(s.px, s.x, alpha), lerp(s.py, s.y, alpha), 0); }

/* ───────────────────────── Theme (day / night follows the viewer) ───────────────────────── */
const THEMES = {
  day: { zenith: 0x3f86d6, horizon: 0xd4e8de, glow: 0xfff1cc, cloud: 0xffffff, cloudAmt: 1, stars: 0, fog: 0xbdd8c8, fogD: 0.0125, hemiSky: 0xd6ecff, hemiGround: 0x6f7a50, hemiI: 1.0, sun: 0xfff0d8, sunI: 1.5, rim: 0xbfe0ff, rimI: 0.4, exposure: 1.0, shaftC: 0xfff2cc, shaft: 0.27, mistC: 0xeef8f0, mist: 0.3, moteC: 0xfff6c8, mote: 0.5, moteSize: 0.09 },
  night: { zenith: 0x040a1c, horizon: 0x1a3352, glow: 0x7f9fe0, cloud: 0x2a3c58, cloudAmt: 0.8, stars: 1, fog: 0x13263a, fogD: 0.016, hemiSky: 0x6f8fd0, hemiGround: 0x101a1c, hemiI: 0.62, sun: 0x9fbcff, sunI: 1.05, rim: 0x5878c0, rimI: 0.35, exposure: 1.4, shaftC: 0x9fbaff, shaft: 0.07, mistC: 0x9fb6d6, mist: 0.2, moteC: 0xd8ff7a, mote: 1, moteSize: 0.2 },
};
let themeNow = THEMES.day;
function applyTheme() {
  const cs = getComputedStyle(document.documentElement);
  const t = themeNow = THEMES[cs.getPropertyValue('--scene-mode').trim() === 'night' ? 'night' : 'day'], U = skyMat.uniforms;
  U.uZenith.value.copy(lin(t.zenith)); U.uHorizon.value.copy(lin(t.horizon)); U.uGlow.value.copy(lin(t.glow)); U.uCloud.value.copy(lin(t.cloud));
  U.uCloudAmt.value = t.cloudAmt; U.uStars.value = t.stars;
  scene.fog.color.copy(lin(t.fog)); scene.fog.density = t.fogD;
  hemi.color.copy(lin(t.hemiSky)); hemi.groundColor.copy(lin(t.hemiGround)); hemi.intensity = t.hemiI;
  sun.color.copy(lin(t.sun)); sun.intensity = t.sunI; rim.color.copy(lin(t.rim)); rim.intensity = t.rimI;
  renderer.toneMappingExposure = t.exposure;
  ambient.shafts.material.color.copy(lin(t.shaftC));
  ambient.mist.material.color.copy(lin(t.mistC)); ambient.mist.material.opacity = t.mist;
  ambient.motes.material.color.copy(lin(t.moteC)); ambient.motes.material.opacity = t.mote; ambient.motes.material.size = t.moteSize;
}
const darkMQ = matchMedia('(prefers-color-scheme: dark)');
if (darkMQ.addEventListener) darkMQ.addEventListener('change', applyTheme);
new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

/* ───────────────────────── Boot & loop ───────────────────────── */
buildLevel();
buildTerrain();
buildDecor();
player.vis = buildPlayerModel(); scene.add(player.vis.root);
player.shadow = makeShadow(0.95);
if (matchMedia('(pointer: coarse)').matches) { Input.device = 'touch'; document.body.classList.add('touch'); quality.level = 1; }
applyTheme();
applyQuality();
resetLevel();
showOverlay('title');
bootMs = Math.round(performance.now() - bootT0);
addEventListener('resize', fitCamera);
if (document.fonts && document.fonts.load) document.fonts.load('700 58px Fredoka').then(() => world.signs.forEach(drawSign)).catch(() => {});

let lastT = 0, acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (!lastT) lastT = now;
  const raw = Math.max(0, (now - lastT) / 1000), rdt = Math.min(raw, 0.1);   // rAF time can precede script time after a slow boot
  lastT = now;
  Input.pollPad();
  if (Input.pad.startPressed) { if (state.mode === 'play') pause(); else if (state.mode === 'paused') resume(); }
  else if (Input.pad.aPressed && state.overlay) primaryAction();
  const running = state.mode === 'play' || state.mode === 'won';
  if (running) {
    if (raw < 0.5) trackFrameRate(raw);
    acc += rdt;
    let n = 0;
    while (acc >= STEP && n < 6) { snapshot(); step(STEP); acc -= STEP; n++; }
    if (n === 6) acc = 0;
  }
  render(state.mode === 'paused' ? 0 : rdt, running ? acc / STEP : 1);
}
requestAnimationFrame(frame);

// Debug handle for poking at the sim from the console
window.__sprout = { bootMs: () => bootMs, state, stats, player, world, Input, seeds, step, snapshot, render, startGame, resetLevel, snapCamera, quality, PHYS, fps: () => quality.fps.toFixed(1) + ' @ level ' + quality.level };
})();
</script>
